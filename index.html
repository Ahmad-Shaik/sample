<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="body bg-secondary">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card text-center">
            <div class="card-body">
                <form method="POST"  action="https://script.google.com/macros/s/AKfycbyTXZaBex9KzVeaCXHMuwf7UsZbA_12l20JJV1NdGkZtLZa7b2SYQw7oMPOsqVXJ_RX/exec">
                    <div class="mb-3">
                        <label for="" class="form-label">Email address</label>
                        <input name="Email" type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">Name</label>
                        <input name="Name" type="text" class="form-control" id="exampleInputPassword1">
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">Phone no</label>
                        <input name="Phone" type="text" class="form-control" id="exampleInputPassword1">
                    </div>
                    <div class="mb-3">
                        <select name="select" class="form-select" aria-label="Default select example">
                            <option selected>Open this select menu</option>
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                          </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>
    </div>
    
</body>

</html>
